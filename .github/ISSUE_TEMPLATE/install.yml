name: Plugin installation / 插件安装
description: DSH cannot install, enable or load dsh-mek-bot. / DSH 无法安装、启用或加载 dsh-mek-bot。
labels: [bug]
body:
  - type: dropdown
    id: step
    attributes:
      label: Where did it stop? / 卡在哪一步？
      options:
        - Install / 安装
        - Enable the bundle / 启用组合包
        - Open the Bot panel / 打开 Bot 面板
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Installation source / 安装来源
      placeholder: dsh-mek-bot-0.2.15.tgz
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: DSH version, profile and operating system / DSH 版本、profile 和操作系统
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Error text / 报错原文
      description: Remove credentials and personal data before sharing logs. / 粘贴日志前移除凭据和个人信息。
    validations:
      required: true
